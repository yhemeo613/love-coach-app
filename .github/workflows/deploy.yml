name: CD

# 部署流水线：push 到 main 自动部署；也支持 Actions 页面手动触发
# 服务器端逻辑在 scripts/deploy-remote.sh（可评审、可本地复用）
on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署串行：正在部署时新触发排队等待，绝不并发操作服务器
concurrency:
  group: cd-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    # 安全开关：仓库 Variables 里 DEPLOY_ENABLED=true 才会执行
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: 部署前检查
        run: |
          missing=""
          [ -n "${{ secrets.SSH_HOST }}" ] || missing="$missing SSH_HOST"
          [ -n "${{ secrets.SSH_USER }}" ] || missing="$missing SSH_USER"
          [ -n "${{ secrets.SSH_KEY }}" ] || missing="$missing SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::缺少 Secrets:$missing（见 README「CI/CD」一节）"
            exit 1
          fi
          echo "目标: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT || 22 }}"
          echo "目录: ${{ vars.APP_DIR || '/opt/apps/love-coach' }}"
          echo "提交: ${{ github.sha }}（${{ github.event_name }} / ${{ github.actor }}）"
          echo "检查通过"

      - name: 配置 SSH
        uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}

      - name: 执行部署
        run: |
          ssh deploy-target "APP_DIR='${{ vars.APP_DIR || '/opt/apps/love-coach' }}' bash -s" \
            < scripts/deploy-remote.sh 2>&1 | tee /tmp/deploy-output.log

      - name: 采集部署摘要
        if: always()
        run: |
          scp deploy-target:/tmp/deploy-summary.md /tmp/summary.md 2>/dev/null \
            || echo "（未获取到部署摘要）" > /tmp/summary.md
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时抓取服务器日志
        if: failure()
        run: |
          ssh deploy-target "cd ${{ vars.APP_DIR || '/opt/apps/love-coach' }} && docker compose ps && docker compose logs --tail=80 app" || true
