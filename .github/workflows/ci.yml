name: CI

# 校验流水线：类型检查 / 生产构建 / Prisma 迁移一致性 / 两个 Dockerfile 构建 /
# 密钥扫描 / 语料分块自检。push 与 PR 都跑，问题在合入前暴露。
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- 1. 类型检查与构建 ----------
  check:
    name: 类型检查 & 构建
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
      # 与 Dockerfile 构建层一致的占位值，仅为通过导入期校验
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: build-time-placeholder-secret-not-used-at-runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 环境信息
        run: |
          echo "仓库：${{ github.repository }} | 提交：${{ github.sha }}（${{ github.event_name }}）"
          node -v && npm -v

      - name: 安装依赖
        run: npm ci

      - name: 生成 Prisma Client
        run: npx prisma generate

      - name: 类型检查
        run: npm run typecheck

      - name: 生产构建
        run: npm run build

      - name: 构建产物概况
        run: |
          du -sh .next 2>/dev/null || true
          ls -la .next/standalone/server.js 2>/dev/null || echo "（未生成 standalone）"

  # ---------- 2. 数据库结构一致性 ----------
  # 改了 schema.prisma 却没写迁移，或迁移与 schema 漂移，都在这里拦下
  schema:
    name: Prisma 迁移一致性
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: shadow
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shadow"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CHECKPOINT_DISABLE: "1"
      # 指向 shadow 库即可，diff 对比的是迁移目录与 schema，不碰真实数据
      DATABASE_URL: postgresql://shadow:shadow@127.0.0.1:5432/shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci

      - name: schema 与迁移比对（有漂移即失败）
        env:
          # Prisma 7：shadow 库地址写在 prisma.config.ts 的 datasource.shadowDatabaseUrl，
          # 由环境变量注入（不再是命令行参数）
          SHADOW_DATABASE_URL: postgresql://shadow:shadow@127.0.0.1:5432/shadow
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code \
          && echo "schema 与迁移一致"

  # ---------- 3. Docker 镜像构建验证 ----------
  docker:
    name: Docker 镜像构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: 构建应用镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建嵌入服务镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: ./embed
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像概况
        run: docker images --format "{{.Repository}}:{{.Tag}}  {{.Size}}" | head -10

  # ---------- 4. 安全与语料自检 ----------
  hygiene:
    name: 密钥扫描 & 语料自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks 需要完整历史

      - name: 密钥扫描（gitleaks，扫全史）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 语料分块自检（不需要数据库与模型，秒级）
        run: node scripts/rag-selftest.mjs
