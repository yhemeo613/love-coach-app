# 恋爱教练 · Nginx 反向代理示例
# 用途：域名 + HTTPS 访问（Google 登录要求 HTTPS），并把 SSE 流式正确透传
#
# 用法：
#   1) 替换 your-domain.com
#   2) 证书可用 certbot 申请：certbot --nginx -d your-domain.com
#   3) 放到 /etc/nginx/conf.d/love-coach.conf 后 nginx -t && systemctl reload nginx

# HTTP 全部跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Let's Encrypt 校验路径需要保持明文可访问
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上传体积（当前仅文本对话，留出余量）
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # 关键：AI 回复是 SSE 流式输出，必须关闭缓冲，
        # 否则内容会被 Nginx 攒到最后一次性下发，用户看到「卡住然后突然全出来」
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 健康检查不记日志
    location = /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        access_log off;
    }

    # 静态资源长缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# WebSocket/Upgrade 映射（放在 http 块；若已存在可省略）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
